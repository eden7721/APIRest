<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análisis de Ventas vista Desktop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <h1 style="text-align: center;">Vista Desktop</h1>
    <!--form-1-->
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h4 class="mb-4">Cargar y Filtrar Datos</h4>

            <!-- File input -->
            <div class="mb-3">
                <label for="btn-cargar-datos" class="form-label">Subir archivo</label>
                <input id="btn-cargar-datos" type="file" class="form-control">
            </div>
            <!-- Botón -->
            <div class="d-flex gap-2">
                <button id="btn-cargar-datos" class="btn btn-primary">
                    Cargar Datos
                </button>
                <button id="btn-recuperar-ventas" class="btn btn-primary">
                    Recuperar Ventas
                </button>
            </div>

            <!-- RECUPERAR REGISTROS DINÁMICAMENTE -->
            <div id="cargar-registros" class="d-flex flex-wrap gap-3 mt-4">

            </div>
        </div>
    </div>

    <template id="template-registro">
        <div class="card shadow p-3" style="width: 18rem;">
            <div class="card-body">
                <h5 class="card-title"><span class="card-producto"></span></h5>
                <p class="card-text">
                    Categoría: <span class="card-categoria"></span><br>
                    Cliente: <span class="card-cliente"></span><br>
                    Precio unitario: <span class="card-precio"></span><br>
                    Cantidad: <span class="card-cantidad"></span><br>
                    Valor de venta: <span class="card-valor"></span><br>
                    Fecha de compra: <span class="card-fecha"></span>
                </p>
            </div>
        </div>
    </template>
    <script>
        function esDispositivoMovil() {
            const porTamano = window.innerWidth <= 768;
            const porUserAgent = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);
            return porTamano && porUserAgent;
        }

        if (esDispositivoMovil()) {
            window.location.replace("movil.html");
        }
    </script>
    <script src="script/recuperar_registros.js"></script>
</body>

</html>
